apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-search-config
  namespace: apis
data:
  MONGO_DBNAME: "newsdb"
  EVIDENCE_SEARCH_CACHE_COLLECTION: "evidence_search_cache_v2"
  EVIDENCE_UNUSABLE_URL_COLLECTION: "evidence_unusable_urls_v1"
  EVIDENCE_UNUSABLE_URL_TTL_SECONDS: "3600"
  EVIDENCE_UNUSABLE_URL_MAX_ENTRIES: "1024"
  EVIDENCE_UNUSABLE_ACCESS_DENIED_TTL_SECONDS: "1800"
  EVIDENCE_UNUSABLE_PENDING_TTL_SECONDS: "120"
  EVIDENCE_UNUSABLE_RATE_LIMITED_TTL_SECONDS: "120"
  EVIDENCE_UNUSABLE_SERVER_FAILURE_TTL_SECONDS: "120"
  EVIDENCE_UNUSABLE_NETWORK_FAILURE_TTL_SECONDS: "120"
  EVIDENCE_UNUSABLE_EMPTY_CONTENT_TTL_SECONDS: "1800"
  EVIDENCE_UNUSABLE_NOT_FOUND_TTL_SECONDS: "3600"
  EVIDENCE_UNUSABLE_SUCCESS_HISTORY_TTL_SECONDS: "86400"
  EVIDENCE_UNUSABLE_HISTORY_POLICY: "fetch-outcomes-v1"
  EVIDENCE_SEARCH_CACHE_TTL_SECONDS: "86400"
  EVIDENCE_SEARCH_TRANSIENT_FAILURE_TTL_SECONDS: "300"
  EVIDENCE_SEARCH_UNUSABLE_TTL_SECONDS: "1800"
  SEARCH_PROVIDER: "exa" # Any provider registered in common.search
  EXA_PRIMARY_MODE: "lite"
  EXA_FALLBACK_MODE: "auto"
  TAVILY_PRIMARY_DEPTH: "advanced"
  SEARCH_INCLUDE_ANSWER: "false"
  SEARCH_INCLUDE_RAW_CONTENT: "true"
  SEARCH_PROVIDER_MAX_RESULTS: "10"
  SEARCH_TIMEOUT: "30"
  EVIDENCE_FETCH_FULL_TEXT: "true"
  # Bounded, outcome-driven retries. Stable access/content failures are never
  # retried on the same URL; see document_fetcher.RETRYABLE_OUTCOMES.
  EVIDENCE_FETCH_MAX_ATTEMPTS: "2"
  EVIDENCE_FETCH_RETRY_BASE_SECONDS: "0.5"
  EVIDENCE_FETCH_RETRY_MAX_SECONDS: "3"
  EVIDENCE_FETCH_RETRY_JITTER_RATIO: "0.2"
  EVIDENCE_FETCH_RETRY_BUDGET_SECONDS: "15"
  EVIDENCE_PDF_MAX_PAGES: "80"
  EVIDENCE_MAX_QUERY_RELAXATION_ATTEMPTS: "3"
  EVIDENCE_CANDIDATE_MULTIPLIER: "3"
  EVIDENCE_MAX_RESULTS_PER_DOMAIN: "2"
  EVIDENCE_TARGET_CITABLE_SOURCES: "1"
