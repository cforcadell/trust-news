apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  namespace: apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        volumeMounts:
        - name: kafka-tls
          mountPath: /etc/kafka-tls
          readOnly: true
        env:
        - name: KAFKA_SECURITY_PROTOCOL
          value: "SSL"
        - name: KAFKA_CA_FILE
          value: /etc/kafka-tls/ca.crt
        #image: tfm-generate-asertions:latest
        image: admin
        imagePullPolicy: IfNotPresent  # Importante para usar la imagen local
        ports:
        - containerPort: 8071
        envFrom:
        - configMapRef:
            name: admin-config
        - secretRef:
            name: mongodb-app-secret
        - configMapRef:
            name: s03-runtime
        - secretRef:
            name: s03-client-assermetry-admin
      volumes:
      - name: kafka-tls
        secret:
          secretName: s07a-kafka-ca
