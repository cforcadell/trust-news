apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - path: patch-s03-client-secret.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: source-router

secretGenerator:
  - name: source-router-enc
    namespace: apis
    envs:
      - source-router.env
  - name: s03-client-assermetry-source-router
    namespace: apis
    envs:
      - s03-client.env

generatorOptions:
  disableNameSuffixHash: true

namespace: apis
