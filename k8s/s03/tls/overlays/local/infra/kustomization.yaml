apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: s03-internal-ca
    files:
      - ca.crt=pki/ca.crt
  - name: s03-tls-keycloak
    type: kubernetes.io/tls
    files:
      - tls.crt=pki/infra-keycloak.crt
      - tls.key=pki/infra-keycloak.key
