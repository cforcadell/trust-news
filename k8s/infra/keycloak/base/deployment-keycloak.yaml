apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: infra
spec:
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-keycloak-db
          image: postgres:15
          imagePullPolicy: IfNotPresent
          env:
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: DB_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h keycloak-db -p 5432 -U "$KC_DB_USERNAME" -d keycloak; do
                echo "Waiting for keycloak-db:5432..."
                sleep 2
              done
      containers:
        - name: keycloak
          image: keycloak
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --optimized
            - --http-enabled=true
          
          # 1. Cargamos todas las variables normales desde el ConfigMap
          envFrom:
            - configMapRef:
                name: keycloak-env-config

          # 2. Mantenemos las variables sensibles vinculadas a Secrets
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: ADMIN_USER
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: ADMIN_PASSWORD
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: DB_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: DB_PASSWORD

          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /auth/health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12