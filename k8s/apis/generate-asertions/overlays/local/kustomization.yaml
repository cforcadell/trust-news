
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml
patches:
  - path: ../../../../s03/runtime/patches/apis-generate-asertions-deployment.json
  - path: ../../../../s03/runtime/patches/apis-generate-asertions-service.json
generatorOptions:
  disableNameSuffixHash: true
# Reemplaza el comando manual: kubectl create secret generic mongodb-secret ...
secretGenerator:
- name: api-keys
  namespace: apis
  envs:
    - generate-asertions.env
- name: s03-client-assermetry-generate
  namespace: apis
  envs:
    - s03-client.env

namespace: apis
