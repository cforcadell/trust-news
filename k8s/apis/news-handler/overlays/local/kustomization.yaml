apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apis

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml

patches:
  - path: ../../../../s03/runtime/patches/apis-news-handler-deployment.json
  - path: ../../../../s03/runtime/patches/apis-news-handler-service.json
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: s03-client-assermetry-news-handler
    namespace: apis
    envs:
      - s03-client.env
