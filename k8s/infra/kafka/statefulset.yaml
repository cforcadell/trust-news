apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: infra
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - containerPort: 9092
            - containerPort: 9093 # Puerto para el controlador
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            failureThreshold: 180
          env:
            # --- El secreto para que Confluent formatee KRaft automáticamente ---
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk" # Un UUID fijo en base64 (obligatorio)
            
            # --- Configuración KRaft ---
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.infra.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            
            # --- Listeners ---
            - name: KAFKA_LISTENERS
              value: "SSL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "SSL://kafka.infra.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "SSL:SSL,CONTROLLER:SSL"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "SSL"
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PKCS12"
            - name: KAFKA_SSL_KEYSTORE_FILENAME
              value: broker.p12
            - name: KAFKA_SSL_KEYSTORE_CREDENTIALS
              value: KEYSTORE_PASSWORD
            - name: KAFKA_SSL_KEY_CREDENTIALS
              value: KEYSTORE_PASSWORD
            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: "PEM"
            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: "/etc/kafka/secrets/ca.crt"
            - name: KAFKA_SSL_CLIENT_AUTH
              value: "none"
            
            # --- Opciones generales y de Almacenamiento ---
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1" # Crucial porque solo tienes 1 nodo
            # Must be at least as large as the maximum application message.
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "4194304"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "8388608"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-tls
              mountPath: /etc/kafka/secrets
              readOnly: true
      volumes:
        - name: kafka-tls
          secret:
            secretName: s07a-kafka-broker
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
