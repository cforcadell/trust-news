apiVersion: v1
kind: ConfigMap
metadata:
  name: validate-common-config
  namespace: apis
data:
  # AI_PROVIDER: "openrouter"
  # MODEL: "arcee-ai/trinity-large-preview:free"
  # API_URL: "https://openrouter.ai/api/v1/chat/completions"

  

  VALIDATOR_TYPE: "1"
  EVIDENCE_SEARCH_URL: "http://evidence-search.apis.svc.cluster.local:8074"
  SOURCE_ROUTER_URL: "http://source-router.apis.svc.cluster.local:8075"
  ADMIN_URL: "http://admin-service.apis.svc.cluster.local:8400"
  OPENROUTER_API_URL: "https://openrouter.ai/api/v1/chat/completions"
  MISTRAL_API_URL: "https://api.mistral.ai/v1/chat/completions"
  GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta"
  GROK_API_URL: "https://api.x.ai/v1/chat/completions"

  LLM_MEMORY_VALIDATION_PROMPT: |
    Actúa como validador factual prudente.
    Valida la aserción usando tu conocimiento general, el contexto de la aserción y razonamiento lógico.
    El contexto con origin=explicit prima sobre el contexto con origin=inferred.
    El contexto con origin=inferred ayuda a interpretar la aserción, pero no convierte una afirmación no verificable en verdadera.
    No inventes información.
    Si necesitas enlaces o evidencias externas para decidir y no los tienes, devuelve UNKNOWN.
    Explica porque has tomado su decision de forma breve y objetiva.
    Devuelve exclusivamente JSON válido:
    {
      "resultado": "TRUE | FALSE | UNKNOWN",
      "descripcion": "Justificación breve y objetiva"
    }

  LLM_SEARCH_VALIDATION_PROMPT: |
    Actúa como validador factual con búsqueda online.
    Busca evidencias actuales en Internet cuando sea necesario.
    Usa el contexto de la aserción para formular la búsqueda: origin=explicit prima sobre origin=inferred, y origin=inferred se usa cuando falta contexto explícito.
    Prioriza fuentes oficiales, agencias de noticias y fuentes reputadas.
    Explica por qué has tomado la decisión de forma breve y objetiva.
    La búsqueda se realiza dentro del proveedor y Assermetry no puede comprobar el corpus consultado.
    No es obligatorio devolver fuentes. Si el proveedor expone enlaces concretos puedes incluirlos en sources, pero se tratarán como fuentes declaradas no comprobadas, nunca como evidencia documental verificada.
    No inventes enlaces, citas ni atribuciones. Si no tienes información suficiente, devuelve UNKNOWN.
    Devuelve exclusivamente JSON válido:
    {
      "resultado": "TRUE | FALSE | UNKNOWN",
      "descripcion": "Justificación breve y objetiva"
    }

  RAG_EVIDENCE_VALIDATION_PROMPT: |
    Actúa como validador factual estricto.
    Debes validar la aserción usando exclusivamente las evidencias proporcionadas.
    No uses conocimiento interno salvo razonamiento lógico básico.
    Usa origin=explicit como contexto principal de la aserción. Usa origin=inferred solo cuando falte contexto explícito equivalente.
    No uses el contexto inferido como evidencia factual suficiente: el veredicto debe apoyarse en evidencias recuperadas o en contradicción directa de esas evidencias.
    No inventes fuentes.
    No accedas a URLs externas.
    Si las evidencias no son suficientes, devuelve UNKNOWN.
    Explica porque has tomado su decision de forma breve y objetiva usando URLs y fragmentos concretos.
    No digas "según la fuente 1", "Fuente 1", "CONTEXTO 1", "según las evidencias" ni referencias genéricas en descripcion, reason ni evidence_text.
    Si devuelves TRUE o FALSE, evidence_used debe contener al menos una referencia a un context_id proporcionado.
    En descripcion menciona el dominio o título concreto usado, no su índice interno.
    supports indica si la evidencia apoya la aserción: true si la confirma, false si la contradice.
    Sólo puedes seleccionar context_id incluidos literalmente en el prompt. No devuelvas URL, source_id,
    chunk_id ni evidence_text: el servidor reconstruye esos campos desde el contexto recuperado.
    Si ninguna evidencia contiene un fragmento directo que apoye o contradiga la aserción, devuelve UNKNOWN.
    Devuelve exclusivamente JSON válido:
    {
      "resultado": "TRUE | FALSE | UNKNOWN",
      "descripcion": "Justificación breve basada en URLs y fragmentos concretos",
      "confidence": "HIGH | MEDIUM | LOW",
      "evidence_used": [
        {
          "context_id": "string",
          "supports": true,
          "reason": "string"
        }
      ]
    }

  # Kafka (Namespace infra)
  KAFKA_BOOTSTRAP: "kafka.infra.svc.cluster.local:9092"
  TOPIC_RESPONSES: "fake_news_responses"
  TOPIC_LIGHT_VALIDATION_REQUESTS: "fake_news_requests_light_validation"

  # Blockchain (Namespace blockchain)
  RPC_URL: "http://geth-rpc-endpoint.blockchain.svc.cluster.local:8555"
  CONTRACT_ADDRESS: "0x928E691aF55fF3530127BcA7E06e35f3F9a77CF6"
  CONTRACT_ABI_PATH: "/app/smart-contracts/artifacts/contracts/TrustNews.sol/TrustNews.json"

  # IPFS (Namespace apis)
  IPFS_API_URL: "http://ipfs-fastapi.apis.svc.cluster.local:8060"
  LOG_LEVEL: "INFO"
  TEMPERATURE: "0.0"
