apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-search
  namespace: apis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evidence-search
  template:
    metadata:
      labels:
        app: evidence-search
    spec:
      containers:
      - name: evidence-search
        image: evidence-search
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8074
        envFrom:
        - configMapRef:
            name: evidence-search-config
        - secretRef:
            name: search-secret
        - secretRef:
            name: mongodb-app-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8074
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8074
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8074
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
