
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml

configMapGenerator:
- name: gateway-config
  namespace: apis
  behavior: merge  
  literals:
    - KEYCLOAK_ISSUER_URL="https://localhost:9443/auth/realms/TrustNews"

patches:
  - path: patch-resources.yaml
namespace: apis