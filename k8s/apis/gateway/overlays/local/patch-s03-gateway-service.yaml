apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apis
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: apis-s03-gateway@kubernetescrd
spec:
  ports:
    - name: http
      port: 8500
      targetPort: 8500
      protocol: TCP
    - name: s03-https
      port: 9443
      targetPort: 9443
      protocol: TCP
