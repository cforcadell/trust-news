apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra
resources:
  - ../../service.yaml
  - ../../statefulset.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: s07a-kafka-broker
    envs:
      - ../local/kafka-tls.env
    files:
      - broker.p12=../local/broker.p12
      - ca.crt=../local/ca.crt
      - kafdrop.properties=../../kafdrop.properties
