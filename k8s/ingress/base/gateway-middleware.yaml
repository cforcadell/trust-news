apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gateway-strip-backend-prefix
  namespace: apis
spec:
  stripPrefix:
    prefixes:
      - /backend
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gateway-request-body-limit
  namespace: apis
spec:
  buffering:
    maxRequestBodyBytes: 5242880
    memRequestBodyBytes: 262144
