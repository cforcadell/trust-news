apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-handler
  namespace: apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-handler
  template:
    metadata:
      labels:
        app: news-handler
    spec:
      initContainers: # SECCIÓN A AÑADIR (Corre antes de todo)
        - name: wait-for-kafka
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              until nc -z kafka.infra.svc.cluster.local 9092; do
                echo "Esperando a Kafka..."
                sleep 2
              done
      containers:
      - name: news-handler
        volumeMounts:
        - name: kafka-tls
          mountPath: /etc/kafka-tls
          readOnly: true
        env:
        - name: KAFKA_SECURITY_PROTOCOL
          value: "SSL"
        - name: KAFKA_CA_FILE
          value: /etc/kafka-tls/ca.crt
        #image: tfm-news-handler:latest
        image: news-handler
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8072
        envFrom:
        - configMapRef:
            name: news-handler-config
        - secretRef:
            name: mongodb-app-secret
        - configMapRef:
            name: blockchain-mode
            optional: true
        - configMapRef:
            name: s03-runtime
        - secretRef:
            name: s03-client-assermetry-news-handler
      volumes:
      - name: kafka-tls
        secret:
          secretName: s07a-kafka-ca
