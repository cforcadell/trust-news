apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - path: patch-s03-client-secret.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: evidence-search

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: search-secret
    namespace: apis
    envs:
      - search.env
  - name: s03-client-assermetry-evidence-search
    namespace: apis
    envs:
      - s03-client.env

namespace: apis
