apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - path: ../../../../s03/runtime/patches/apis-evidence-search-deployment.json
  - path: ../../../../s03/runtime/patches/apis-evidence-search-service.json
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: search-secret
    namespace: apis
    envs:
      - search.env
  - name: s03-client-assermetry-evidence-search
    namespace: apis
    envs:
      - s03-client.env

namespace: apis
