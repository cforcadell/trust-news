apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apis
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: s03-runtime
    literals:
      - S03_ENABLED=true
      - KEYCLOAK_ISSUER_URL=https://localhost:7443/auth/realms/TrustNews
      - KEYCLOAK_JWKS_URL=https://keycloak.infra.svc.cluster.local:9443/auth/realms/TrustNews/protocol/openid-connect/certs
      - S03_TOKEN_URL=https://keycloak.infra.svc.cluster.local:9443/auth/realms/TrustNews/protocol/openid-connect/token
      - S03_USER_CLIENTS=TrustNewsWeb,TrustNewsApi
      - S03_CA_FILE=/etc/s03-ca/ca.crt
