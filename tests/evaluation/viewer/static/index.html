<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchmark Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Benchmark Viewer</strong><span>Diagnóstico de órdenes guardadas</span></div>
    <span class="local-label">Visor local · solo lectura</span>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Campañas y órdenes">
      <h2>Navegación</h2>
      <nav class="sidebar-nav" aria-label="Vistas del visor">
        <div class="nav-group">
          <button id="nav-campaigns" class="active" type="button" aria-current="page">Campañas</button>
          <div id="selected-campaign" class="sidebar-submenu" aria-live="polite"></div>
        </div>
        <div class="nav-group">
          <button id="nav-orders" type="button">Órdenes</button>
          <div id="order-menu" class="sidebar-submenu" aria-live="polite"></div>
        </div>
      </nav>
    </aside>
    <main id="main">
      <section class="empty"><h1>Cargando campañas…</h1><p>Las órdenes de evaluación guardadas aparecerán aquí.</p></section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
