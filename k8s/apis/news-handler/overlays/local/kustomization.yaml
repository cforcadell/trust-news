apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apis

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml

patches:
  - path: patch-s03-client-secret.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: news-handler

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: s03-client-assermetry-news-handler
    namespace: apis
    envs:
      - s03-client.env
