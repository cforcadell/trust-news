apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-search-config
  namespace: apis
data:
  MONGO_DBNAME: "newsdb"
  EVIDENCE_DOMAIN_CONFIG_COLLECTION: "evidence_domain_profiles"
  EVIDENCE_SEARCH_CACHE_COLLECTION: "evidence_search_cache"
  EVIDENCE_SEARCH_CACHE_TTL_SECONDS: "86400"
  TAVILY_API_URL: "https://api.tavily.com/search"
  TAVILY_SEARCH_DEPTH: "advanced"
  TAVILY_INCLUDE_ANSWER: "false"
  TAVILY_INCLUDE_RAW_CONTENT: "true"
  TAVILY_MAX_RESULTS: "5"
  TAVILY_TIMEOUT: "30"
