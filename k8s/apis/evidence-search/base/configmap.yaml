apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-search-config
  namespace: apis
data:
  MONGO_DBNAME: "newsdb"
  EVIDENCE_SEARCH_CACHE_COLLECTION: "evidence_search_cache_v2"
  EVIDENCE_SEARCH_CACHE_TTL_SECONDS: "86400"
  SEARCH_PROVIDER: "exa" #tavily || exa
  #SEARCH_API_URL: "https://api.tavily.com/search"
  SEARCH_API_URL: "https://api.exa.ai/search"
  SEARCH_DEPTH: "advanced"
  SEARCH_INCLUDE_ANSWER: "false"
  SEARCH_INCLUDE_RAW_CONTENT: "true"
  SEARCH_PROVIDER_MAX_RESULTS: "50"
  SEARCH_TIMEOUT: "30"
  EVIDENCE_FETCH_FULL_TEXT: "true"
