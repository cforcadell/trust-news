apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-search-config
  namespace: apis
data:
  MONGO_DBNAME: "newsdb"
  EVIDENCE_DOMAIN_CONFIG_COLLECTION: "evidence_domain_profiles"
  EVIDENCE_NORMALIZATION_CONFIG_COLLECTION: "evidence_normalization_configs"
  EVIDENCE_SEARCH_CACHE_COLLECTION: "evidence_search_cache"
  EVIDENCE_SEARCH_CACHE_TTL_SECONDS: "86400"
  SEARCH_PROVIDER: "tavily" #tavily || exa
  SEARCH_API_URL: "https://api.tavily.com/search"
  #SEARCH_API_URL: "https://api.exa.ai/search"
  SEARCH_DEPTH: "advanced"
  SEARCH_INCLUDE_ANSWER: "false"
  SEARCH_INCLUDE_RAW_CONTENT: "true"
  SEARCH_MAX_RESULTS: "5"
  SEARCH_TIMEOUT: "30"
  EVIDENCE_FETCH_FULL_TEXT: "true"
