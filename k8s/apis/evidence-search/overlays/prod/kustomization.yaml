apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# En prod el secreto se crea fuera del repo, por ejemplo:
# kubectl create secret generic tavily-secret \
#   --namespace apis \
#   --from-env-file=tavily.env
#
# Si se prefiere generarlo con Kustomize desde un fichero local no versionado:
# secretGenerator:
#   - name: tavily-secret
#     namespace: apis
#     envs:
#       - prod-tavily.env

namespace: apis
