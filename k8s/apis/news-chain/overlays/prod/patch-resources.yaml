apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-chain # Tiene que coincidir con el nombre de la base
  namespace: apis
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: news-chain
        # Definimos cuánta CPU y RAM reserva y cuál es su límite máximo
        resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
