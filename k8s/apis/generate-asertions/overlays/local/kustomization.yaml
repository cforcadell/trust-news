
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml
patches:
  - path: patch-s03-client-secret.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: generate-asertions
generatorOptions:
  disableNameSuffixHash: true
# Reemplaza el comando manual: kubectl create secret generic mongodb-secret ...
secretGenerator:
- name: api-keys
  namespace: apis
  envs:
    - generate-asertions.env
- name: s03-client-assermetry-generate
  namespace: apis
  envs:
    - s03-client.env

namespace: apis
