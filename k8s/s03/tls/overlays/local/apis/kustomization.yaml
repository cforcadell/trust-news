apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apis
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: s03-internal-ca
    files:
      - ca.crt=pki/ca.crt
  - name: s03-tls-gateway
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-gateway.crt, tls.key=pki/apis-gateway.key]
  - name: s03-tls-admin-service
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-admin-service.crt, tls.key=pki/apis-admin-service.key]
  - name: s03-tls-news-handler
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-news-handler.crt, tls.key=pki/apis-news-handler.key]
  - name: s03-tls-generate-asertions
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-generate-asertions.crt, tls.key=pki/apis-generate-asertions.key]
  - name: s03-tls-source-router
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-source-router.crt, tls.key=pki/apis-source-router.key]
  - name: s03-tls-evidence-search
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-evidence-search.crt, tls.key=pki/apis-evidence-search.key]
  - name: s03-tls-validate-service-1
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-validate-service-1.crt, tls.key=pki/apis-validate-service-1.key]
  - name: s03-tls-validate-service-2
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-validate-service-2.crt, tls.key=pki/apis-validate-service-2.key]
  - name: s03-tls-validate-service-3
    type: kubernetes.io/tls
    files: [tls.crt=pki/apis-validate-service-3.crt, tls.key=pki/apis-validate-service-3.key]
