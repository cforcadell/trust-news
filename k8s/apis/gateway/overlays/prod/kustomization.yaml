
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml

configMapGenerator:
- name: gateway-config
  namespace: apis
  behavior: merge  
  literals:
    - KEYCLOAK_ISSUER_URL="https://localhost:9443/auth/realms/TrustNews"
    - GATEWAY_API_DOCS_ENABLED="false"

patches:
  - path: patch-resources.yaml
  - path: ../../../../s03/runtime/patches/apis-gateway-deployment.json
  - path: ../../../../s03/runtime/patches/apis-gateway-service.json
namespace: apis
