
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml

patches:
  - path: ../../../../s03/runtime/patches/apis-gateway-deployment.json
  - path: ../../../../s03/runtime/patches/apis-gateway-service.json
generatorOptions:
  disableNameSuffixHash: true
# Reemplaza el comando manual: kubectl create secret generic mongodb-secret ...
secretGenerator:
- name: gate-config
  namespace: apis
  envs:
    - gateway.env
- name: s03-client-assermetry-gateway
  namespace: apis
  envs:
    - s03-client.env

namespace: apis
