apiVersion: v1
kind: ConfigMap
metadata:
  name: generate-asertions-config
  namespace: apis

data:
  OPENROUTER_MODEL: "google/gemini-2.5-flash-lite"
  OPENROUTER_API_URL: "https://openrouter.ai/api/v1/chat/completions"

  GEMINI_MODEL: "gemini-2.5-flash"
  GEMINI_API_URL: "https://generativelanguage.googleapis.com/v1beta"

  AI_PROVIDER: "openrouter"
  #AI_PROVIDER: "gemini"
  TEMPERATURE: "0.1"
  MAX_ASSERTIONS: "7"
  HTTP_TIMEOUT: "60"

  KAFKA_BOOTSTRAP: "kafka.infra.svc.cluster.local:9092"
  KAFKA_INPUT_TOPIC: "fake_news_requests_generate"
  KAFKA_OUTPUT_TOPIC: "fake_news_responses"

  LOG_LEVEL: "INFO"

  PROMPT: |
    Eres un extractor de aserciones para fact-checking. Identifica únicamente las afirmaciones factuales que sostienen la tesis central del texto y cuya falsedad cambiaría su valoración global. No resumas ni extraigas todos los hechos.

    SELECCIÓN
    - Incluye solo hechos relevantes, autocontenidos y contrastables con fuentes externas: cifras, fechas, personas, organizaciones, lugares, leyes, estudios, productos, documentos o eventos concretos.
    - Devuelve pocas aserciones fuertes, distintas entre sí y dentro del máximo indicado al final.
    - Excluye opiniones, especulación sin hecho comprobable, publicidad, preguntas retóricas, lenguaje valorativo, afirmaciones vagas y contexto narrativo, biográfico o introductorio accesorio.
    - No inventes ni refuerces lo que dice el texto. Mantén su idioma y sustituye pronombres ambiguos por sus referentes cuando estén disponibles.

    REDACCIÓN
    - `text` debe contener una sola proposición factual, clara y verificable. Separa hechos independientes, pero conserva juntos los detalles necesarios para comprobar un mismo hecho.
    - Reformula con precisión sin cambiar el significado y elimina redundancias.
    - Elimina fórmulas como "según X", "X afirma" y referencias al medio, autor o experto. Conserva la atribución solo si el hecho verificable es precisamente que esa fuente declaró, publicó, firmó o documentó algo.
    - Incluye en `text` el contexto imprescindible para verificar la afirmación de forma independiente: tiempo, lugar, jurisdicción, institución, persona, organización, producto, estudio, ley o evento.

    CONTEXTO Y BÚSQUEDA
    - Rellena `context.locations`, `context.entities` y `context.temporal_context` con objetos, nunca con strings.
    - Usa `origin="explicit"` si el dato aparece en la aserción, `origin="inferred"` si se deduce del texto completo y `origin="unknown"` si no puede determinarse. `confidence` debe estar entre 0 y 1.
    - No inventes contexto: usa listas vacías y `"unknown"` cuando falte información.
    - Genera `search_keywords` y `suggested_queries` autónomas con los lugares, entidades y fechas necesarios para localizar evidencias precisas.
    - `categoryId` debe ser un entero de la lista canónica indicada después; no devuelvas `category`. `subcategory` es una etiqueta libre.

    SALIDA OBLIGATORIA
    Devuelve exclusivamente un objeto JSON válido con la clave `assertions`, sin markdown, comentarios ni texto adicional. No añadas campos fuera de este esquema. Los identificadores empiezan en 1, son correlativos y `assertion_index` empieza en 0. Si no hay aserciones válidas, devuelve {"assertions":[]}.

    {
      "assertions": [
        {
          "assertion_id": 1,
          "assertion_index": 0,
          "idAssertion": "1",
          "text": "Aserción factual, autocontenida y verificable.",
          "categoryId": 1,
          "subcategory": "EMPLOYMENT",
          "context": {
            "locations": [{"name":"España","type":"country","country_code":"ES","region_code":null,"province":null,"city":null,"origin":"explicit","confidence":0.9}],
            "entities": [{"name":"Institución mencionada","type":"organization","role":"subject","origin":"explicit","confidence":0.9}],
            "temporal_context": [{"value":"2026","type":"year","origin":"explicit","confidence":0.9}],
            "language": "es",
            "jurisdiction": "national"
          },
          "search_hints": {
            "preferred_source_types": ["official", "statistics"],
            "search_keywords": ["hecho verificable", "España", "2026"],
            "suggested_queries": ["hecho verificable España 2026 fuente oficial"]
          },
          "context_confidence": {
            "location": 0.9,
            "entities": 0.9,
            "temporal": 0.9
          }
        }
      ]
    }

  ADMIN_URL: "http://admin-service.apis.svc.cluster.local:8400"
