
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../service.yaml
  - ../../statefulset.yaml

# Production must provide mongodb-secret externally with root/admin and app-user keys.
# secretGenerator:
# - name: mongodb-secret
#   namespace: infra
#   envs:
#     - prod-mongodb.env  # MONGO_INITDB_ROOT_*, MONGO_APP_USERNAME, MONGO_APP_PASSWORD, MONGO_APP_DATABASE
patches:
  - path: patch-resources.yaml 
configMapGenerator:
- name: mongodb-init-scripts
  namespace: infra
  files:
    - init-users.js=../../init-users.js

generatorOptions:
  disableNameSuffixHash: true