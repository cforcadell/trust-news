apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../prod

configMapGenerator:
  - name: keycloak-env-config
    namespace: infra
    behavior: merge
    literals:
      - KC_HOSTNAME_URL="https://assermetry.com/auth"
      - KC_HOSTNAME_ADMIN_URL="https://assermetry.com/auth"

generatorOptions:
  disableNameSuffixHash: true

namespace: infra
